<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Remote Data Demo</h1>
    <button id="loadBtn">Load post</button>
    <pre id="output">Click the button to fetch data...</pre>

    <script>
        document.getElementById('loadBtn').addEventListener('click', async () => {
        const response = await fetch('https://jsonplaceholder.typicode.com/posts/1');
        const data = await response.json();
        document.getElementById('output').textContent = JSON.stringify(data, null, 2);
      });
    </script>

    <button id="xhrBtn">Load with XMLHttpRequest</button>
    <script>
        document.getElementById('xhrBtn').addEventListener('click', () => {
        const xhr = new XMLHttpRequest();
        xhr.open('GET', 'https://jsonplaceholder.typicode.com/posts/1');
        xhr.onload = () => {
        document.getElementById('output').textContent = xhr.responseText;
        };
        xhr.send();
        });
    </script>

    <button id="jqBtn">Load with jQuery Ajax</button>
    <script>
        $('#jqBtn').on('click', () => {
            $.ajax({
            url: 'https://jsonplaceholder.typicode.com/posts/1',
            method: 'GET',
            success: (data) => {
                $('#output').text(JSON.stringify(data, null, 2));
            }
            });
        });
    </script>

</body>
</html>
